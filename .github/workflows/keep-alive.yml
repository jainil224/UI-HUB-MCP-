name: MCP Keep-Alive

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping MCP server health endpoint
        run: curl --max-time 30 --retry 3 --retry-delay 5 --retry-all-errors -fsS https://api.ui-hub-design.com/health